name: R Environment Setup and Session Info

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1' # Specify the R version you need
          use-public-rspm: true

      - name: Setup R dependencies cache
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.3.1-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-4.3.1-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev cmake libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libcairo2-dev

      - name: Install BiocManager and CRAN packages
        run: |
          install.packages("BiocManager", repos = "https://cloud.r-project.org")
          install.packages(c(
            "tidyverse", "vroom", "svglite", "httr", "cowplot", 
            "patchwork", "gridExtra", "pheatmap", "circlize", 
            "Rtsne", "FNN", "uwot", "igraph", "jsonlite", 
            "magick", "mgcv", "networkD3", "htmlwidgets", "Seurat"
          ), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Install Bioconductor packages
        run: |
          BiocManager::install(c(
            "DESeq2", "clusterProfiler", "org.Hs.eg.db", 
            "AnnotationDbi", "ComplexHeatmap", "GSVA"
          ), ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Generate Session Info
        run: |
          # Load key packages to ensure they are registered in the session info
          library(Seurat)
          library(DESeq2)
          library(clusterProfiler)
          library(GSVA)
          library(tidyverse)
          library(org.Hs.eg.db)
          
          # Print session info
          cat("========================================================\n")
          cat("R SESSION INFORMATION\n")
          cat("========================================================\n")
          sessionInfo()
        shell: Rscript {0}
